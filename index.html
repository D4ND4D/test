<style>
:root{--bg:#0c0e0f;--panel:#121517;--panel-2:#161a1c;--border:#22282b;--border-bright:#5ee6d0;--cyan:#5ee6d0;--amber:#f0b35e;--green:#7ee787;--red:#ff6b6b;--grey:#7b8389;--grey-dim:#52585c;--white:#e9edee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:"JetBrains Mono","IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;min-height:100vh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% -10%,rgba(94,230,208,.05),transparent 60%)}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:14px 14px 28px;transition:margin-top .15s ease}
#app.windowed{max-width:none;margin:0;padding:0;display:block;justify-content:flex-start;overflow:hidden;min-height:100vh}
#desktop{position:relative;width:100%;min-height:100vh;overflow:hidden}
#wmLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.wm-window{position:absolute;width:520px;z-index:10}
.wm-window .term{max-height:72vh;box-shadow:0 0 0 1px rgba(94,230,208,.06),0 16px 40px -10px rgba(0,0,0,.85);transition:box-shadow .18s}
.wm-window.focused .term{box-shadow:0 0 0 1px rgba(94,230,208,.28),0 22px 55px -12px rgba(0,0,0,.95)}
.wm-window .titlebar{cursor:move;user-select:none;-webkit-user-select:none}
.home-pill{position:fixed;bottom:14px;left:14px;z-index:80;background:var(--panel-2);border:1px solid var(--border-bright);color:var(--cyan);border-radius:20px;padding:8px 14px;font-family:inherit;font-size:12.5px;cursor:pointer;box-shadow:0 6px 20px -8px rgba(0,0,0,.7)}
.home-pill:active{transform:scale(.95)}
.float-bar{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px 0;pointer-events:none}
.float-pill{pointer-events:auto;max-width:532px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--border-bright);color:var(--white);font-size:12.5px;border-radius:8px;padding:9px 12px;box-shadow:0 6px 20px -8px rgba(0,0,0,.6);cursor:pointer}
.float-pill.alarm{border-color:var(--red);animation:pulse-alarm 1s infinite}
@keyframes pulse-alarm{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.45)}50%{box-shadow:0 0 0 7px rgba(255,107,107,0)}}
.float-pill .fp-stop{background:transparent;border:1px solid var(--border);color:var(--red);border-radius:6px;font-size:11px;padding:4px 9px;font-family:inherit;cursor:pointer}
.float-pill .fp-mini{background:transparent;border:1px solid var(--border);color:var(--grey);border-radius:6px;font-size:11px;padding:4px 9px;font-family:inherit;cursor:pointer}
.restore-badge{pointer-events:auto;position:fixed;right:12px;bottom:12px;z-index:71;background:var(--panel-2);border:1px solid var(--border-bright);color:var(--cyan);border-radius:20px;padding:8px 14px;font-size:12.5px;font-family:inherit;cursor:pointer;box-shadow:0 6px 20px -8px rgba(0,0,0,.7)}
.restore-badge.alarm{border-color:var(--red);color:var(--red);animation:pulse-alarm 1s infinite}
.term{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 0 0 1px rgba(94,230,208,.04),0 10px 30px -10px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 28px)}
.titlebar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.dot{width:9px;height:9px;border-radius:50%;transition:background .18s,box-shadow .18s}
.dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
.dot.blue{background:#4d9fff!important;box-shadow:0 0 9px rgba(77,159,255,.85)}
.titlebar .path{margin-left:6px;font-size:11px;color:var(--grey-dim);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.titlebar-back{flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--cyan);font-family:inherit;font-size:11.5px;font-weight:600;padding:5px 10px;cursor:pointer}
.titlebar-back:active{background:rgba(94,230,208,.1)}
.screen{padding:18px 16px 20px;flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{text-align:center;color:var(--grey);font-size:11px;letter-spacing:.08em;margin-bottom:14px;text-transform:uppercase}
h1.page-title{font-size:18px;margin:0 0 2px;color:var(--amber);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px}
.cursor{display:inline-block;width:9px;height:16px;background:var(--amber);animation:blink 1.1s steps(1) infinite;vertical-align:-3px}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.page-sub{text-align:center;color:var(--grey);font-size:12px;margin-bottom:16px}
hr.div{border:none;border-top:1px solid var(--border);margin:14px 0}
.menu{display:flex;flex-direction:column;gap:8px}
.menu-item{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:13px 14px;cursor:pointer;transition:border-color .15s,transform .08s;text-align:left;color:var(--white);font-family:inherit;font-size:14.5px;width:100%}
.menu-item:active{transform:scale(.985)}
.menu-item:hover{border-color:var(--border-bright)}
.menu-item .num{color:var(--cyan);font-weight:700;min-width:14px}
.menu-item .icon{font-size:16px}
.menu-item .label{flex:1}
.menu-item .meta{color:var(--grey-dim);font-size:12px}
.menu-item.danger .icon,.menu-item.danger .label{color:var(--red)}
.menu-item.accent .icon,.menu-item.accent .label{color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--white);font-family:inherit;font-size:14px;font-weight:600;padding:13px 16px;cursor:pointer;width:100%;transition:transform .08s,border-color .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--cyan);color:#06231e;border-color:var(--cyan)}
.btn-danger{background:transparent;color:var(--red);border-color:#5a2424}
.btn-ghost{background:transparent;color:var(--grey);border-color:var(--border)}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}
label.field-label{display:block;color:var(--grey);font-size:12px;margin:0 0 6px;letter-spacing:.02em}
textarea,input[type=text],input[type=number],input[type=email],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:inherit;font-size:14.5px;padding:12px 13px;margin-bottom:14px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--cyan)}
textarea{min-height:64px}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--grey);margin-bottom:14px}
.check-row input[type=checkbox]{width:auto;margin:0}
.card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px}
.qa-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.qa-label.q{color:var(--amber)}.qa-label.a{color:var(--green)}
.qa-text{font-size:15.5px;line-height:1.5;color:var(--white)}
.note-content{white-space:pre-wrap;font-size:14.5px;line-height:1.6;color:var(--white)}
.tts-controls{display:flex;gap:10px;margin:14px 0}
.tts-controls .btn{flex:1}
.progress-line{display:flex;justify-content:space-between;color:var(--grey);font-size:12px;margin-bottom:6px}
.bar-track{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin-bottom:16px}
.bar-fill{height:100%;border-radius:4px;transition:width .25s ease}
.bar-fill.cyan{background:var(--cyan)}.bar-fill.green{background:var(--green)}.bar-fill.amber{background:var(--amber)}.bar-fill.red{background:var(--red)}.bar-fill.magenta{background:#c792ea}
.empty-state{text-align:center;color:var(--grey);padding:30px 10px;font-size:13.5px;line-height:1.6}
.empty-state .big{font-size:28px;margin-bottom:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel-2);border:1px solid var(--border-bright);color:var(--white);padding:10px 16px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer-note{margin-top:auto;text-align:center;color:var(--grey-dim);font-size:10.5px;padding-top:14px}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.list-row:hover{border-color:var(--border-bright)}
.list-row .lr-q{font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .lr-meta{color:var(--grey-dim);font-size:11px;white-space:nowrap}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.stat-box .stat-val{font-size:20px;font-weight:700;color:var(--cyan)}
.stat-box .stat-label{font-size:11px;color:var(--grey);margin-top:2px}
.session-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.session-row:last-child{border-bottom:none}
.session-row .sr-date{color:var(--grey-dim);width:62px;flex-shrink:0}
.session-row .sr-subj{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-row .sr-score{font-weight:700;width:48px;text-align:right;flex-shrink:0}
.session-row .sr-cards{color:var(--grey-dim);width:62px;text-align:right;flex-shrink:0}
.timer-display{text-align:center;font-size:46px;font-weight:700;color:var(--cyan);margin:18px 0 10px;letter-spacing:.04em}
.timer-presets{display:flex;gap:8px;margin-bottom:14px}
.timer-presets .btn{font-size:13px;padding:10px}
select.subj-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:inherit;font-size:14.5px;padding:12px 13px;margin-bottom:14px;appearance:none}
.yn-row{display:flex;gap:10px}
.yn-row .btn{font-size:15px;padding:15px}
.badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--border);color:var(--grey);margin-left:6px}
.quiz-timer{text-align:center;font-size:22px;font-weight:700;color:var(--cyan);letter-spacing:.08em;margin-bottom:10px}
.quiz-timer.warn{color:var(--amber)}
.quiz-timer.danger{color:var(--red);animation:pulse-alarm 1s infinite}
.note-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.note-row .nr-title{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-btn{background:transparent;border:1px solid var(--border);color:var(--cyan);border-radius:6px;font-family:inherit;font-size:11.5px;padding:5px 9px;cursor:pointer;flex-shrink:0}
.mini-btn.danger{color:var(--red);border-color:#5a2424}
.mini-btn.green{color:var(--green);border-color:#1f4d3a}
.mini-btn.amber{color:var(--amber);border-color:#5a4a1f}
.mini-btn:active{transform:scale(.94)}
.mini-btn.active{background:rgba(94,230,208,.12);color:var(--cyan);border-color:var(--cyan)}
.wm-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:13px 14px;font-size:14px}
.wm-toggle .switch{width:44px;height:24px;border-radius:12px;background:var(--border);position:relative;transition:background .2s;cursor:pointer;flex-shrink:0}
.wm-toggle .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--grey);transition:transform .2s,background .2s}
.wm-toggle .switch.on{background:rgba(94,230,208,.3)}
.wm-toggle .switch.on::after{transform:translateX(20px);background:var(--cyan)}
#authGate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;overscroll-behavior:contain}
.auth-card{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:26px 22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.85);margin:auto}
.auth-brand{text-align:center;color:var(--grey);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
.auth-title{font-size:20px;color:var(--amber);margin:0 0 6px;text-align:center;font-weight:700;letter-spacing:.02em}
.auth-sub{text-align:center;color:var(--grey);font-size:12px;margin-bottom:20px;line-height:1.5}
.auth-field{margin-bottom:12px}
.auth-field label{display:block;color:var(--grey);font-size:11.5px;margin-bottom:5px;letter-spacing:.02em}
.auth-field input{margin-bottom:0;padding:11px 12px;font-size:14px}
.auth-btn{width:100%;padding:13px;font-size:14.5px;margin-top:6px}
.auth-err{color:var(--red);font-size:12px;text-align:center;margin-top:12px;min-height:16px;line-height:1.4}
.auth-link{text-align:center;color:var(--grey);font-size:12.5px;margin-top:16px}
.auth-link a{color:var(--cyan);cursor:pointer;text-decoration:none}
.auth-link a:hover{text-decoration:underline}
.display-id{font-family:inherit;font-size:26px;font-weight:700;color:var(--cyan);text-align:center;letter-spacing:.1em;background:var(--bg);border:1px solid var(--border-bright);border-radius:10px;padding:20px 14px;margin:18px 0;cursor:pointer;user-select:all;-webkit-user-select:all;word-break:break-all}
.display-id:active{transform:scale(.985)}
.display-id-hint{text-align:center;color:var(--grey-dim);font-size:10.5px;margin-top:-10px;margin-bottom:14px;letter-spacing:.05em}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-loading{text-align:center;color:var(--grey);font-size:13px}
.auth-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;margin-bottom:12px;text-align:center;width:100%}
.auth-badge.pending{background:rgba(240,179,94,.15);color:var(--amber)}
.auth-badge.expired{background:rgba(255,107,107,.15);color:var(--red)}
.auth-info-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--grey)}
.auth-info-row:last-child{border-bottom:none}
.auth-info-row .val{color:var(--white);font-weight:600}
.admin-filter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.admin-filter .mini-btn{flex:1;min-width:auto;padding:7px 8px}
.admin-user-row{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 13px;margin-bottom:8px}
.admin-user-row .au-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.admin-user-row .au-name{font-weight:700;color:var(--white);font-size:14px}
.admin-user-row .au-id{font-size:11px;color:var(--cyan);letter-spacing:.05em;white-space:nowrap}
.admin-user-row .au-email{font-size:11px;color:var(--grey);margin-bottom:8px;word-break:break-all}
.admin-user-row .au-status{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;margin-bottom:9px}
.au-status.approved{background:rgba(126,231,135,.15);color:var(--green)}
.au-status.pending{background:rgba(240,179,94,.15);color:var(--amber)}
.au-status.expired{background:rgba(255,107,107,.15);color:var(--red)}
.admin-actions{display:flex;gap:6px;flex-wrap:wrap}
.admin-actions .mini-btn{flex:1;min-width:70px;padding:7px 8px}
@media (max-width:380px){.qa-text{font-size:14.5px}.timer-display{font-size:38px}.display-id{font-size:22px;padding:16px 10px}}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCe10S1IL7yd7vaT64siUZIDLDE2Yol1g0",
  authDomain: "study-assistant-backend.firebaseapp.com",
  projectId: "study-assistant-backend",
  storageBucket: "study-assistant-backend.firebasestorage.app",
  messagingSenderId: "189507822224",
  appId: "1:189507822224:web:b0959b1ceef41481702e15"
};
const ADMIN_UID = "EMTxL9cIU4dhRQeOptEaHfrhWty2";

const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);
const db    = getFirestore(fbApp);

let currentUser = null;
let currentUserDoc = null;
let pendingUsername = null;
let expiryCheckInterval = null;
let APP_READY = false;
let syncDebounceTimer = null;
let lastSyncedAt = null;
let suppressPush = false;
let localDirty = false;
let dataUnsubscribe = null;
let planConfig = { monthlyDays: 30, termDays: 120 };
let planConfigLoaded = false;

/* ========== STORAGE ========== */
const EMPTY_DATA = { flashcards:{}, study_sessions:[], notes:{} };
const STORAGE_KEY = "d4n_study_data_v1";
const TIMER_KEY = "d4n_timer_state_v1";
const WM_ENABLED_KEY = "d4n_wm_enabled_v1";
const WM_STATE_KEY = "d4n_wm_state_v1";
let DATA = loadData();
let TIMER = loadTimer();
let nav = { page:"home", params:{} };
let navStack = [];
let CURRENT_WIN_ID = null;
let ttsState = 'stopped';
let ttsNoteId = null;
let ttsNoteTitle = null;
let WM_ENABLED = false;
let WM = { windows: [], zCounter: 10, focusedId: null };
let seqState = {};
let dragState = null;
let chirpInterval = null;

function loadData(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const d=JSON.parse(raw);if(!d.flashcards)d.flashcards={};if(!d.study_sessions)d.study_sessions=[];if(!d.notes)d.notes={};return d}}catch(e){}const s=JSON.parse(JSON.stringify(EMPTY_DATA));saveData(s);return s}
function saveData(d){   try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}catch(e){}   localDirty = true;   if(!suppressPush) scheduleSyncPush(); }
function blankTimer(){return{active:false,endsAt:0,totalSeconds:0,alarming:false,paused:false,hidden:false,pausedRemaining:0}}
function loadTimer(){try{const raw=localStorage.getItem(TIMER_KEY);if(raw){const t=JSON.parse(raw);if(typeof t.paused!=='boolean')t.paused=false;if(typeof t.hidden!=='boolean')t.hidden=false;if(typeof t.pausedRemaining!=='number')t.pausedRemaining=0;return t}}catch(e){}return blankTimer()}
function saveTimer(){try{localStorage.setItem(TIMER_KEY,JSON.stringify(TIMER))}catch(e){}}

/* ========== AUTH ========== */
function generateDisplayId(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const p=n=>Array.from({length:n},()=>c[Math.floor(Math.random()*c.length)]).join("");return `D4N-${p(3)}-${p(3)}`}
function friendlyAuthError(e){const c=e&&e.code?e.code:"";switch(c){case"auth/email-already-in-use":return"That email is already registered.";case"auth/invalid-email":return"That email doesn't look right.";case"auth/weak-password":return"Password must be at least 6 characters.";case"auth/user-not-found":return"No account with that email.";case"auth/wrong-password":case"auth/invalid-credential":return"Incorrect email or password.";case"auth/too-many-requests":return"Too many attempts. Try again in a minute.";case"auth/network-request-failed":return"Network error. Check your connection.";default:return(e&&e.message)||"Something went wrong."}}
function showAuthGate(html){const g=document.getElementById("authGate");g.style.display="flex";g.innerHTML=html;document.getElementById("app").style.display="none"}
function hideAuthGate(){document.getElementById("authGate").style.display="none";document.getElementById("app").style.display="block"}
function showLoadingScreen(){showAuthGate(`<div class="auth-card"><div class="spinner"></div><div class="auth-loading">Loading…</div></div>`)}
function showErrorScreen(msg){showAuthGate(`<div class="auth-card"><div class="auth-title">Something went wrong</div><div class="auth-sub">${esc(msg)}</div><button class="btn btn-ghost auth-btn" id="errSignOut">Sign out</button></div>`);document.getElementById("errSignOut").addEventListener("click",handleSignOut)}

async function checkStatusAgain(){
  if(!currentUser)return;
  try{
    const snap=await getDoc(doc(db,"users",currentUser.uid));
    if(snap.exists()){currentUserDoc=snap.data();routeBasedOnStatus()}
  }catch(e){toast("Could not check status")}
}
function routeBasedOnStatus(){
  if(!currentUser||!currentUserDoc)return;
  if(currentUser.uid===ADMIN_UID){bootApp();return}
  if(!currentUserDoc.approved){showPendingScreen();return}
  const exp=currentUserDoc.expiresAt?(currentUserDoc.expiresAt.toDate?currentUserDoc.expiresAt.toDate():new Date(currentUserDoc.expiresAt)):null;
  if(exp&&exp<new Date()){showExpiredScreen();return}
  bootApp();
}
async function bootApp(){
  await pullDataFromCloud();
  if(isAdmin() && !planConfigLoaded) await loadPlanConfig();
  hideAuthGate();
  APP_READY=true;
  render();
  renderFloatBar();
  startExpiryCheck();
  startDataListener();
}
function startExpiryCheck(){
  if(expiryCheckInterval)clearInterval(expiryCheckInterval);
  expiryCheckInterval=setInterval(()=>{
    if(!currentUser||currentUser.uid===ADMIN_UID)return;
    if(!currentUserDoc||!currentUserDoc.expiresAt)return;
    const exp=currentUserDoc.expiresAt.toDate?currentUserDoc.expiresAt.toDate():new Date(currentUserDoc.expiresAt);
    if(exp<new Date()){APP_READY=false;showExpiredScreen()}
  },60000);
}
  function scheduleSyncPush(){
  if(!currentUser) return;
  if(currentUser.uid !== ADMIN_UID){
    if(!currentUserDoc || !currentUserDoc.approved) return;
    const exp = currentUserDoc.expiresAt
      ? (currentUserDoc.expiresAt.toDate ? currentUserDoc.expiresAt.toDate() : new Date(currentUserDoc.expiresAt))
      : null;
    if(!exp || exp < new Date()) return;
  }
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(pushDataToCloud, 1500);
}

async function pushDataToCloud(){
  if(!currentUser || !APP_READY) return;
  try{
    const ref = doc(db, "study_data", currentUser.uid);
    await setDoc(ref, {
      flashcards: DATA.flashcards,
      notes: DATA.notes,
      study_sessions: DATA.study_sessions,
      updatedAt: serverTimestamp()
    });
    lastSyncedAt = new Date();
    localDirty = false;
    updateSyncIndicator();
  }catch(e){
    console.warn("Sync push failed:", e);
  }
}

async function pullDataFromCloud(){
  if(!currentUser) return;
  try{
    const ref = doc(db, "study_data", currentUser.uid);
    const snap = await getDoc(ref);
    if(snap.exists()){
      const cloud = snap.data();
      suppressPush = true;
      DATA.flashcards = cloud.flashcards || {};
      DATA.notes = cloud.notes || {};
      DATA.study_sessions = cloud.study_sessions || [];
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
      lastSyncedAt = cloud.updatedAt && cloud.updatedAt.toDate ? cloud.updatedAt.toDate() : new Date();
      localDirty = false;
      suppressPush = false;
    } else {
      await pushDataToCloud();
    }
  }catch(e){
    console.warn("Sync pull failed (offline?):", e);
  }
}

function startDataListener(){
  if(dataUnsubscribe){ try{ dataUnsubscribe(); }catch(e){} dataUnsubscribe = null; }
  if(!currentUser) return;
  const ref = doc(db, "study_data", currentUser.uid);
  dataUnsubscribe = onSnapshot(ref, (snap) => {
    if(!snap.exists()) return;
    if(localDirty) return;
    const cloud = snap.data();
    const cloudTime = cloud.updatedAt && cloud.updatedAt.toDate ? cloud.updatedAt.toDate() : null;
    if(!cloudTime) return;
    if(lastSyncedAt && cloudTime <= lastSyncedAt) return;
    suppressPush = true;
    DATA.flashcards = cloud.flashcards || {};
    DATA.notes = cloud.notes || {};
    DATA.study_sessions = cloud.study_sessions || [];
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
    lastSyncedAt = cloudTime;
    suppressPush = false;
    render();
    toast("🔄 Synced from another device");
  }, (err) => {
    console.warn("Snapshot error:", err);
  });
}

function stopDataListener(){
  if(dataUnsubscribe){ try{ dataUnsubscribe(); }catch(e){} dataUnsubscribe = null; }
}

function updateSyncIndicator(){
  const el = document.getElementById("syncStatus");
  if(!el) return;
  if(!lastSyncedAt){ el.textContent = "Not yet synced"; return; }
  const secs = Math.floor((Date.now() - lastSyncedAt.getTime()) / 1000);
  if(secs < 5) el.textContent = "Synced just now";
  else if(secs < 60) el.textContent = `Synced ${secs}s ago`;
  else if(secs < 3600) el.textContent = `Synced ${Math.floor(secs/60)}m ago`;
  else el.textContent = `Synced ${lastSyncedAt.toLocaleTimeString()}`;
}
setInterval(updateSyncIndicator, 5000);

async function loadPlanConfig(){
  try{
    const ref = doc(db, "config", "plans");
    const snap = await getDoc(ref);
    if(snap.exists()){
      planConfig.monthlyDays = snap.data().monthlyDays || 30;
      planConfig.termDays = snap.data().termDays || 120;
    } else {
      await setDoc(ref, planConfig);
    }
  }catch(e){
    console.warn("Plan config load failed:", e);
  }
  planConfigLoaded = true;
}

async function savePlanConfig(){
  try{
    await setDoc(doc(db, "config", "plans"), planConfig);
    toast("✅ Plan defaults saved");
  }catch(e){
    toast("Could not save plan config");
  }
}
async function handleSignOut(){
  if(!confirm("Sign out?"))return;
  try{if(ttsState==="playing"||ttsState==="paused")ttsStop();if(TIMER.active)stopTimer()}catch(e){}
  if(localDirty) await pushDataToCloud();
  stopDataListener();
  clearTimeout(syncDebounceTimer);
  try{await signOut(auth)}catch(e){toast("Sign out failed")}
}

onAuthStateChanged(auth,async(user)=>{
  if(!user){
    currentUser=null;currentUserDoc=null;APP_READY=false;
    if(expiryCheckInterval){clearInterval(expiryCheckInterval);expiryCheckInterval=null}
    showLoginScreen();return;
  }
  currentUser=user;
  showLoadingScreen();
  try{
    const userRef=doc(db,"users",user.uid);
    let snap;
    try{snap=await getDoc(userRef)}catch(e){showErrorScreen("Could not reach the server. Check your connection and try again.");return}
    if(!snap.exists()){
      const uname=pendingUsername||(user.email?user.email.split("@")[0]:"user");
      pendingUsername=null;
      const displayId=generateDisplayId();
      const userData={email:user.email||"",username:uname,displayId,createdAt:serverTimestamp(),approved:false,approvedAt:null,expiresAt:null,lastSeen:serverTimestamp()};
      try{await setDoc(userRef,userData)}catch(e){showErrorScreen("Could not create your account. Try again.");return}
      currentUserDoc={...userData,approved:false,expiresAt:null,createdAt:new Date()};
      try{await updateProfile(user,{displayName:uname})}catch(e){}
    }else{
      currentUserDoc=snap.data();
      updateDoc(userRef,{lastSeen:serverTimestamp()}).catch(()=>{});
    }
    routeBasedOnStatus();
  }catch(e){console.error(e);showErrorScreen("Failed to load your account.")}
});

/* ========== WINDOW MANAGER ========== */
function loadWM(){try{WM_ENABLED=localStorage.getItem(WM_ENABLED_KEY)==="1";const raw=localStorage.getItem(WM_STATE_KEY);if(raw){const p=JSON.parse(raw);if(Array.isArray(p.windows))WM.windows=p.windows;if(typeof p.zCounter==='number')WM.zCounter=p.zCounter;if(p.focusedId)WM.focusedId=p.focusedId}}catch(e){}if(!WM.windows.find(w=>w.isHome)){const hw={id:genId('win'),page:'home',params:{},parentId:null,x:30,y:30,z:++WM.zCounter,isHome:true};WM.windows=WM.windows.filter(w=>!w.isHome);WM.windows.unshift(hw);WM.focusedId=hw.id}}
function saveWM(){try{localStorage.setItem(WM_ENABLED_KEY,WM_ENABLED?"1":"0");localStorage.setItem(WM_STATE_KEY,JSON.stringify({windows:WM.windows,zCounter:WM.zCounter,focusedId:WM.focusedId}))}catch(e){}}
function windowedActive(){return WM_ENABLED&&window.innerWidth>=700}
function wmWindowById(id){return WM.windows.find(w=>w.id===id)}
function wmChildren(id){return WM.windows.filter(w=>w.parentId===id)}
function wmDescendants(id){const out=[];const q=[id];while(q.length){const c=q.shift();wmChildren(c).forEach(k=>{out.push(k);q.push(k.id)})}return out}
function wmClose(id){const w=wmWindowById(id);if(!w||w.isHome)return;const desc=wmDescendants(id).map(d=>d.id);const ids=new Set([id,...desc]);WM.windows=WM.windows.filter(x=>!ids.has(x.id));if(ids.has(WM.focusedId)){WM.focusedId=WM.windows.length?WM.windows[WM.windows.length-1].id:null}saveWM();render()}
function wmCloseAllExceptHome(){WM.windows=WM.windows.filter(w=>w.isHome);WM.focusedId=WM.windows[0]?WM.windows[0].id:null;saveWM();render()}
function wmOpen(page,params,parentId){const parent=parentId?wmWindowById(parentId):null;const merged={...(params||{})};if(merged.subject===undefined&&parent&&parent.params&&parent.params.subject!==undefined){merged.subject=parent.params.subject}const existing=WM.windows.find(w=>w.page===page);if(existing){const oldSubj=existing.params?existing.params.subject:undefined;const newSubj=merged.subject;if(newSubj!==undefined&&oldSubj!==undefined&&oldSubj!==newSubj){wmPropagateSubject(existing.id,oldSubj,newSubj);existing.params={...existing.params,...merged}}else{existing.params={...(existing.params||{}),...merged}}existing.z=++WM.zCounter;WM.focusedId=existing.id;saveWM();return existing}let x=40,y=40;if(parent){const sibCount=wmChildren(parentId).length;x=Math.min(parent.x+60+(sibCount%4)*30,Math.max(20,window.innerWidth-560));y=Math.min(parent.y+60+(sibCount%6)*30,Math.max(20,window.innerHeight-300));x=Math.max(20,x);y=Math.max(20,y)}const w={id:genId('win'),page,params:merged,parentId:parentId||null,x,y,z:++WM.zCounter,isHome:false};WM.windows.push(w);WM.focusedId=w.id;saveWM();return w}
function wmGoBackTo(page,params){const cur=wmWindowById(CURRENT_WIN_ID);if(!cur)return;const merged={...(params||{})};if(merged.subject===undefined&&cur.params&&cur.params.subject!==undefined){merged.subject=cur.params.subject}const descIds=new Set(wmDescendants(cur.id).map(d=>d.id));const existing=WM.windows.find(w=>w.page===page&&w.id!==cur.id&&!descIds.has(w.id));if(existing){const toClose=new Set([cur.id,...descIds]);WM.windows=WM.windows.filter(w=>!toClose.has(w.id));existing.z=++WM.zCounter;WM.focusedId=existing.id;saveWM();render();return}const toClose=new Set(descIds);WM.windows=WM.windows.filter(w=>!toClose.has(w.id));cur.page=page;cur.params=merged;saveWM();render()}
function wmReplace(page,params){const cur=wmWindowById(CURRENT_WIN_ID);if(!cur)return;const merged={...(params||{})};if(merged.subject===undefined&&cur.params&&cur.params.subject!==undefined){merged.subject=cur.params.subject}const descIds=new Set(wmDescendants(cur.id).map(d=>d.id));WM.windows=WM.windows.filter(w=>!descIds.has(w.id));cur.page=page;cur.params=merged;saveWM();render()}
function wmFocusExisting(page,excludeId){const existing=WM.windows.find(w=>w.page===page&&w.id!==excludeId);if(!existing)return false;existing.z=++WM.zCounter;WM.focusedId=existing.id;saveWM();render();return true}
function wmPropagateSubject(windowId,oldSubject,newSubject){const w=wmWindowById(windowId);if(!w)return;if(w.params&&w.params.subject===oldSubject)w.params.subject=newSubject;switch(w.page){case'study_session':{const cards=DATA.flashcards[newSubject]||[];if(cards.length){const order=cards.map((_,i)=>i);shuffle(order);w.params={subject:newSubject,order,idx:0,correct:0,revealed:false}}else{w.page='study_complete';w.params={subject:newSubject,correct:0,total:0}}break}case'study_complete':w.params={subject:newSubject,correct:0,total:0};break;case'quiz_session':case'quiz_complete':w.page='quiz_settings';w.params={subject:newSubject};break;case'edit_card_form':{const cards=DATA.flashcards[newSubject]||[];const idx=w.params.cardIdx||0;if(!cards.length||idx>=cards.length)w.params.cardIdx=0;break}case'read_view':{const notes=DATA.notes[newSubject]||[];if(!notes.find(n=>n.id===w.params.noteId)){w.page='read_menu';w.params={subject:newSubject}}break}case'read_write_form':{if(w.params.noteId){const notes=DATA.notes[newSubject]||[];if(!notes.find(n=>n.id===w.params.noteId)){w.page='read_menu';w.params={subject:newSubject}}}break}}wmDescendants(windowId).forEach(d=>wmPropagateSubject(d.id,oldSubject,newSubject))}

/* ========== HELPERS ========== */
function normQ(q){return(q||"").trim().toLowerCase().replace(/\s+/g,' ')}
function genId(p){return `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`}
function slug(s){return(s||"").toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-]/g,'')}
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function fmtDate(iso){if(!iso)return"—";const d=new Date(iso);if(isNaN(d))return"—";const mm=String(d.getMonth()+1).padStart(2,"0");const dd=String(d.getDate()).padStart(2,"0");const hh=String(d.getHours()).padStart(2,"0");const mi=String(d.getMinutes()).padStart(2,"0");return `${mm}/${dd} ${hh}:${mi}`}
function fmtDateTime(dt){if(!dt)return"—";const d=dt.toDate?dt.toDate():new Date(dt);if(isNaN(d))return"—";return d.toLocaleDateString()}
function subjects(){const primary=Object.keys(DATA.flashcards);const extra=Object.keys(DATA.notes).filter(s=>!DATA.flashcards.hasOwnProperty(s));return[...primary,...extra]}
function cardCount(s){return(DATA.flashcards[s]||[]).length}
function notesFor(s){return DATA.notes[s]||[]}
function notesCount(s){return notesFor(s).length}
function getNote(s,id){return notesFor(s).find(n=>n.id===id)}
function ensureSubject(n){if(!DATA.flashcards[n])DATA.flashcards[n]=[];if(!DATA.notes[n])DATA.notes[n]=[]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function isAdmin(){return currentUser&&currentUser.uid===ADMIN_UID}
    
/* ========== EXPORT / IMPORT ========== */
function buildExportPayload(opts={}){
  const {subjectsFilter=null,includeData=true}=opts;
  const list=subjectsFilter?subjectsFilter:subjects();
  const flashcards={},notes={};
  list.forEach(s=>{
    flashcards[s]=(DATA.flashcards[s]||[]).map(c=>includeData?{...c}:{question:c.question,answer:c.answer,review_count:0,last_reviewed:null,created:c.created});
    notes[s]=(DATA.notes[s]||[]).map(n=>({...n}));
  });
  let study_sessions=[];
  if(includeData)study_sessions=DATA.study_sessions.filter(s=>!subjectsFilter||subjectsFilter.includes(s.subject));
  return{type:"d4n_study_backup",version:2,exported_at:new Date().toISOString(),flashcards,notes,study_sessions};
}
function downloadJSON(payload,base){
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url;a.download=`${base}-${stamp}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportFull(){downloadJSON(buildExportPayload({includeData:true}),"d4n-study-full-backup")}
function exportNoData(){downloadJSON(buildExportPayload({includeData:false}),"d4n-study-backup-nodata")}
function exportSubject(s,inc){downloadJSON(buildExportPayload({subjectsFilter:[s],includeData:inc}),`d4n-study-${slug(s)}`)}

function mergeImportedData(incoming){
  const stats={newSubjects:0,newCards:0,skippedCards:0,newSessions:0,skippedSessions:0,newNotes:0,skippedNotes:0};
  const inFC=incoming.flashcards||{};
  for(const subject in inFC){
    const cards=inFC[subject]||[];
    if(!DATA.flashcards[subject]){DATA.flashcards[subject]=[];stats.newSubjects++}
    const existing=DATA.flashcards[subject];
    const existQ=new Set(existing.map(c=>normQ(c.question)));
    cards.forEach(card=>{
      const key=normQ(card.question);
      if(existQ.has(key)){stats.skippedCards++;return}
      existing.push({question:card.question,answer:card.answer,review_count:card.review_count||0,last_reviewed:card.last_reviewed||null,created:card.created||new Date().toISOString()});
      existQ.add(key);stats.newCards++;
    });
  }
  const inN=incoming.notes||{};
  for(const subject in inN){
    if(!DATA.notes[subject])DATA.notes[subject]=[];
    if(!DATA.flashcards[subject])DATA.flashcards[subject]=[];
    const keys=new Set(DATA.notes[subject].map(n=>normQ(n.title)+"|"+normQ(n.content).slice(0,60)));
    (inN[subject]||[]).forEach(n=>{
      const key=normQ(n.title)+"|"+normQ(n.content).slice(0,60);
      if(keys.has(key)){stats.skippedNotes++;return}
      DATA.notes[subject].push({id:n.id||genId('note'),title:n.title||"Untitled",content:n.content||"",created:n.created||new Date().toISOString()});
      keys.add(key);stats.newNotes++;
    });
  }
  const inS=incoming.study_sessions||[];
  const skeys=new Set(DATA.study_sessions.map(s=>`${s.subject}|${s.date}`));
  inS.forEach(s=>{
    const key=`${s.subject}|${s.date}`;
    if(skeys.has(key)){stats.skippedSessions++;return}
    DATA.study_sessions.push(s);skeys.add(key);stats.newSessions++;
  });
  DATA.study_sessions.sort((a,b)=>new Date(a.date)-new Date(b.date));
  saveData(DATA);
  return stats;
}
function parseImportedNotesFile(file,cb){
  const reader=new FileReader();
  reader.onload=ev=>{
    const text=ev.target.result;
    let notesToAdd=[];
    if(file.name.toLowerCase().endsWith('.json')){
      let parsed;
      try{parsed=JSON.parse(text)}catch(e){cb(null,"Couldn't parse that JSON file.");return}
      if(Array.isArray(parsed))notesToAdd=parsed;
      else if(parsed.notes&&Array.isArray(parsed.notes))notesToAdd=parsed.notes;
      else if(parsed.title||parsed.content)notesToAdd=[parsed];
      else{cb(null,"Not a recognized notes file.");return}
    }else{
      const title=file.name.replace(/\.[^/.]+$/,"");
      notesToAdd=[{title,content:text}];
    }
    cb(notesToAdd,null);
  };
  reader.onerror=()=>cb(null,"Couldn't read that file.");
  reader.readAsText(file);
}

function ttsPlay(subject,noteId){

}

}

/* ========== TIMER ========== */
function timerRemaining(){if(!TIMER.active)return 0;if(TIMER.paused)return TIMER.pausedRemaining;return Math.max(0,Math.ceil((TIMER.endsAt-Date.now())/1000))}
function fmtMMSS(sec){sec=Math.max(0,Math.round(sec||0));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function chirp(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=1046;g.gain.value=0.09;o.start();setTimeout(()=>{try{o.stop();ctx.close()}catch(e){}},180)}catch(e){}if(navigator.vibrate)navigator.vibrate(150)}
function startChirping(){if(chirpInterval)return;chirp();chirpInterval=setInterval(chirp,1200)}
function stopChirping(){clearInterval(chirpInterval);chirpInterval=null}
function startTimer(mins){
  stopChirping();
  TIMER={active:true,endsAt:Date.now()+mins*60000,totalSeconds:mins*60,alarming:false,paused:false,hidden:false,pausedRemaining:0};
  saveTimer();navStack=[];
  if(windowedActive()){
    const existing=WM.windows.find(w=>w.page==='timer_active');
    if(existing){existing.z=++WM.zCounter;WM.focusedId=existing.id;saveWM();render();return}
    wmReplace('timer_active',{});
  }else{goto("timer_active",{},false)}
}
function stopTimer(){TIMER=blankTimer();saveTimer();stopChirping();renderFloatBar()}
function pauseTimer(){if(!TIMER.active||TIMER.paused||TIMER.alarming)return;TIMER.pausedRemaining=timerRemaining();TIMER.paused=true;saveTimer();renderFloatBar()}
function resumeTimer(){if(!TIMER.active||!TIMER.paused)return;TIMER.endsAt=Date.now()+(TIMER.pausedRemaining||0)*1000;TIMER.paused=false;saveTimer();renderFloatBar()}
function hideTimerBar(){if(!TIMER.active)return;TIMER.hidden=true;saveTimer();renderFloatBar()}
function showTimerBar(){TIMER.hidden=false;saveTimer();renderFloatBar()}
function tickTimer(){
  if(!TIMER.active||TIMER.paused)return;
  const rem=timerRemaining();
  if(rem<=0&&!TIMER.alarming){TIMER.alarming=true;TIMER.hidden=false;saveTimer();startChirping()}
  const onTimerPage=windowedActive()?(wmWindowById(CURRENT_WIN_ID)?.page==='timer_active'):(nav.page==='timer_active');
  if(onTimerPage)render();else renderFloatBar();
}

/* ========== ANSWER MATCHING ========== */
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(m===0)return n;if(n===0)return m;
  let prev=new Array(n+1),curr=new Array(n+1);
  for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){
    curr[0]=i;
    for(let j=1;j<=n;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      curr[j]=Math.min(prev[j]+1,curr[j-1]+1,prev[j-1]+cost);
    }
    [prev,curr]=[curr,prev];
  }
  return prev[n];
}
function fuzzRatio(a,b){
  a=a||"";b=b||"";
  if(a.length===0&&b.length===0)return 100;
  const dist=levenshtein(a,b);
  const maxLen=a.length+b.length;
  if(maxLen===0)return 100;
  return Math.round((1-dist/maxLen)*100);
}
const STOP_WORDS=new Set(["a","an","the","of","to","for","and","or","in","on","at","by","with","as","from","into","than","then","so","that","this","it","its","is","are","was","were","be","been","being","you","your","they","them","their","he","she","him","his","her","we","our","i","me","my","there","which","who","whom","also","such"]);
function tokenizeAnswer(s){return(s||"").toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w&&(w.length>1||/\d/.test(w))&&!STOP_WORDS.has(w))}
function tokensSimilar(a,b){
  if(a===b)return true;
  if(a.length>=4&&b.length>=4&&(a.startsWith(b)||b.startsWith(a)))return true;
  if(a.length>=5&&b.length>=5&&fuzzRatio(a,b)>=78)return true;
  return false;
}
function answerSimilarity(user,expected){
  const u=(user||"").trim();const e=(expected||"").trim();
  if(!u)return 0;
  const seq=fuzzRatio(u.toLowerCase(),e.toLowerCase());
  const et=tokenizeAnswer(e);const ut=tokenizeAnswer(u);
  if(!et.length||!ut.length)return seq;
  const usedU=new Set();let matched=0;
  et.forEach(t=>{
    for(let i=0;i<ut.length;i++){
      if(usedU.has(i))continue;
      if(tokensSimilar(t,ut[i])){matched++;usedU.add(i);break}
    }
  });
  const precision=matched/ut.length;
  const recall=matched/et.length;
  const f1=(precision+recall)>0?(2*precision*recall)/(precision+recall):0;
  return Math.max(seq,Math.round(f1*100));
}

function shell(titleHTML,subtitle,bodyHTML,opts={}){

  if(push&&!windowedActive())navStack.push({page:nav.page,params:nav.params});

function back(){
  if(windowedActive()&&CURRENT_WIN_ID){
    const w=wmWindowById(CURRENT_WIN_ID);
    if(w&&!w.isHome){wmClose(CURRENT_WIN_ID);return}
  }
  const prev=navStack.pop();
  nav=prev||{page:"home",params:{}};
  render();
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove("show"),1800);
}
function wmHandleGo(page,params,btn){
  const cur=wmWindowById(CURRENT_WIN_ID);
  if(!cur)return;
  if(page==='select_subject'){
    if(wmFocusExisting('select_subject',cur.id))return;
    const homeWin=WM.windows.find(w=>w.isHome);
    wmOpen('select_subject',{},homeWin?homeWin.id:null);
    render();
    return;
  }
  if(page==='subject_menu'&&cur.page==='select_subject'){
    const existing=WM.windows.find(w=>w.page==='subject_menu');
    if(existing){
      const oldSubject=existing.params.subject;
      const newSubject=params.subject;
      if(oldSubject!==newSubject){
        wmPropagateSubject(existing.id,oldSubject,newSubject);
        saveWM();
        toast(`Switched to ${newSubject}`);
      }
      existing.z=++WM.zCounter;
      WM.focusedId=existing.id;
      saveWM();render();return;
    }
    wmOpen(page,params,cur.id);
    render();
    return;
  }
  if(btn&&btn.dataset.clearstack){wmGoBackTo(page,params);return}
  wmOpen(page,params,cur.id);
  render();
}

function pageProgress(){
  const sessions=DATA.study_sessions;
  if(sessions.length===0){
    return shell("STUDY PROGRESS","",emptyState("📭","No sessions yet.","Start studying to see stats here!")+backBtn("home","Back to menu"),{path:"~/study/progress"});
  }
  const totalSessions=sessions.length;
  const totalCards=sessions.reduce((s,x)=>s+x.cards_studied,0);
  const totalCorrect=sessions.reduce((s,x)=>s+(x.correct_answers||0),0);
  const avg=sessions.reduce((s,x)=>s+x.score,0)/totalSessions;
  const bySub={};
  sessions.forEach(s=>{if(!bySub[s.subject])bySub[s.subject]={count:0,total:0};bySub[s.subject].count++;bySub[s.subject].total+=s.score});
  const subjRows=Object.keys(bySub).map(sub=>{
    const st=bySub[sub];const a=st.total/st.count;
    const col=a>=80?"var(--green)":a>=60?"var(--amber)":"var(--red)";
    return `<div class="session-row"><span class="sr-subj">${esc(sub)}</span><span class="sr-cards">${st.count} session${st.count>1?'s':''}</span><span class="sr-score" style="color:${col};">${a.toFixed(0)}%</span></div>`;
  }).join("");
  const last5=sessions.slice(-5).reverse();
  const rows=last5.map(s=>{
    const col=s.score>=80?"var(--green)":s.score>=60?"var(--amber)":"var(--red)";
    return `<div class="session-row"><span class="sr-date">${fmtDate(s.date)}</span><span class="sr-subj">${esc(s.subject)}${s.type==='quiz'?' 🎯':''}</span><span class="sr-score" style="color:${col};">${s.score.toFixed(0)}%</span><span class="sr-cards">${s.cards_studied} cards</span></div>`;
  }).join("");
  const body=`
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val">${totalSessions}</div><div class="stat-label">Sessions completed</div></div>

  `;

let adminUsersCache=null;
let adminFilterMode="all";

async function fetchAdminUsers(){
  const col=collection(db,"users");
  const snap=await getDocs(col);
  const out=[];
  snap.forEach(d=>out.push({uid:d.id,...d.data()}));
  out.sort((a,b)=>(a.username||"").localeCompare(b.username||""));
  return out;
}
function userStatus(u){
  if(u.approved){
    const exp=u.expiresAt?(u.expiresAt.toDate?u.expiresAt.toDate():new Date(u.expiresAt)):null;
    if(exp&&exp<new Date())return"expired";
    return"approved";
  }
  return"pending";
}
function userPlan(u){
  return u.plan === "term" ? "term" : (u.plan === "monthly" ? "monthly" : null);
}
function planLabel(u){
  const p=userPlan(u);
  if(p==="term")return "📚 Term";
  if(p==="monthly")return "📅 Monthly";
  return "—";
}
  return"pending";
}

  try{

}async function adminAction(action,uid,plan){
  if(!isAdmin())return;
  try{
    const ref=doc(db,"users",uid);
    if(action==="approve"){
      const days=plan==="term"?planConfig.termDays:planConfig.monthlyDays;
      const exp=new Date(Date.now()+days*86400000);
      await updateDoc(ref,{approved:true,approvedAt:serverTimestamp(),expiresAt:exp,plan});
      toast(`✅ Approved (${plan}, ${days}d)`);
    }else if(action==="extend"){
      const days=plan==="term"?planConfig.termDays:planConfig.monthlyDays;
      const snap=await getDoc(ref);
      const cur=snap.data().expiresAt;
      const curD=cur?(cur.toDate?cur.toDate():new Date(cur)):new Date();
      const base=curD<new Date()?new Date():curD;
      const exp=new Date(base.getTime()+days*86400000);
      await updateDoc(ref,{approved:true,expiresAt:exp,plan});
      toast(`✅ Extended ${days}d (${plan})`);
    }else if(action==="revoke"){
      await updateDoc(ref,{approved:false,expiresAt:null,plan:null});
      toast("✗ Access revoked");
    }else if(action==="delete"){
      if(!confirm("Permanently delete this user record? Their login still exists but they'll be treated as a new signup next time. Continue?"))return;
      await deleteDoc(ref);
      toast("🗑 User deleted");
    }
    adminUsersCache=await fetchAdminUsers();
    render();
  }catch(e){
    console.error(e);
    toast("Action failed: "+((e&&e.message)||"unknown"));
  }
}

/* ========== RENDER ========== */
function render(){
  if(!APP_READY)return;
  const app=document.getElementById("app");
  seqState={};
  if(windowedActive()){renderDesktop();renderFloatBar();return}
  app.classList.remove('windowed');
  CURRENT_WIN_ID=null;
  const fn=PAGE_MAP[nav.page]||pageHome;
  app.innerHTML=fn();
  attachHandlers();
  renderFloatBar();
  window.scrollTo(0,0);
}
function renderDesktop(){
  const app=document.getElementById("app");
  app.classList.add('windowed');
  const home=WM.windows.find(w=>w.isHome);
  if(!WM.focusedId||!wmWindowById(WM.focusedId))WM.focusedId=home?home.id:null;
  let html=`<div id="desktop"><svg id="wmLines"></svg>`;
  WM.windows.forEach(w=>{
    const focused=w.id===WM.focusedId;
    const savedNav=nav;
    nav={page:w.page,params:w.params};
    CURRENT_WIN_ID=w.id;
    const fn=PAGE_MAP[w.page]||pageHome;
    const inner=fn();
    nav=savedNav;
    html+=`<div class="wm-window ${focused?'focused':''}" id="win-${w.id}" data-window-id="${w.id}" style="left:${w.x}px;top:${w.y}px;z-index:${w.z};">${inner}</div>`;
  });
  html+=`</div><button class="home-pill" id="wmHomePill">⌂ Home</button>`;
  app.innerHTML=html;
  CURRENT_WIN_ID=WM.focusedId;
  attachHandlers();
  attachWindowHandlers();
  requestAnimationFrame(drawLines);
}
function drawLines(){
  const svg=document.getElementById('wmLines');
  if(!svg)return;
  const rect=svg.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);
  svg.setAttribute('preserveAspectRatio','none');
  let html='';
  WM.windows.forEach(w=>{
    if(!w.parentId)return;
    const parent=wmWindowById(w.parentId);
    if(!parent)return;
    const pw=document.getElementById(`win-${parent.id}`);
    const cw=document.getElementById(`win-${w.id}`);
    if(!pw||!cw)return;
    const pR=pw.getBoundingClientRect();
    const cR=cw.getBoundingClientRect();
    const dR=svg.getBoundingClientRect();
    const x1=pR.left-dR.left+pR.width/2;
    const y1=pR.top-dR.top+pR.height;
    const x2=cR.left-dR.left+cR.width/2;
    const y2=cR.top-dR.top;
    const midY=(y1+y2)/2;
    html+=`<path d="M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}" stroke="#5ee6d0" stroke-width="1.5" fill="none" opacity="0.45" stroke-dasharray="6 4"/>`;
  });
  svg.innerHTML=html;
}

/* ========== FLOAT BAR ========== */
function renderFloatBar(){
  const bar=document.getElementById('floatBar');
  const app=document.getElementById('app');
  if(!bar)return;
  let pills="";
  let count=0;
  if(TIMER.active&&!TIMER.hidden){
    count++;
    if(TIMER.alarming){pills+=`<div class="float-pill alarm" id="fpTimer"><span>⏰ Time's up!</span><button class="fp-stop" id="fpTimerStop">Stop</button></div>`}
    else if(TIMER.paused){pills+=`<div class="float-pill" id="fpTimer"><span>⏸ ${fmtMMSS(timerRemaining())} — paused</span><button class="fp-mini" id="fpTimerHide">Hide</button></div>`}
    else{pills+=`<div class="float-pill" id="fpTimer"><span>⏰ ${fmtMMSS(timerRemaining())} left</span><button class="fp-mini" id="fpTimerHide">Hide</button></div>`}
  }
  if(ttsState==='playing'||ttsState==='paused'){
    count++;
    pills+=`<div class="float-pill" id="fpTts"><span>🔊 ${ttsState==='paused'?'Paused':'Reading'}: ${esc(ttsNoteTitle||'')}</span><button class="fp-stop" id="fpTtsStop">Stop</button></div>`;
  }
  if(TIMER.active&&TIMER.hidden){
    pills+=`<button class="restore-badge${TIMER.alarming?' alarm':''}" id="fpTimerRestore">⏰ ${TIMER.alarming?"Time's up!":fmtMMSS(timerRemaining())}</button>`;
  }
  bar.innerHTML=pills;
  if(app&&!windowedActive())app.style.marginTop=count>0?`${count*46}px`:"0px";
  else if(app)app.style.marginTop="0px";
  const fpTimer=document.getElementById('fpTimer');
  if(fpTimer)fpTimer.addEventListener('click',e=>{
    if(e.target&&(e.target.id==='fpTimerStop'||e.target.id==='fpTimerHide'))return;
    if(windowedActive()){
      const existing=WM.windows.find(w=>w.page==='timer_active');
      if(existing){existing.z=++WM.zCounter;WM.focusedId=existing.id;saveWM();render();return}
      const cur=wmWindowById(CURRENT_WIN_ID);
      if(cur){wmOpen('timer_active',{},cur.id);render();return}
    }else if(nav.page!=='timer_active')goto('timer_active',{});
  });
  const fpTimerStop=document.getElementById('fpTimerStop');
  if(fpTimerStop)fpTimerStop.addEventListener('click',e=>{e.stopPropagation();stopTimer();render()});
  const fpTimerHide=document.getElementById('fpTimerHide');
  if(fpTimerHide)fpTimerHide.addEventListener('click',e=>{e.stopPropagation();hideTimerBar();render()});
  const fpTimerRestore=document.getElementById('fpTimerRestore');
  if(fpTimerRestore)fpTimerRestore.addEventListener('click',e=>{e.stopPropagation();showTimerBar()});
  const fpTtsStop=document.getElementById('fpTtsStop');
  if(fpTtsStop)fpTtsStop.addEventListener('click',e=>{e.stopPropagation();ttsStop();render()});
}

/* ========== WINDOW DRAG & FOCUS ========== */
function attachWindowHandlers(){
  document.querySelectorAll('.wm-window').forEach(el=>{
    el.addEventListener('mousedown',()=>{
      const id=el.dataset.windowId;
      if(WM.focusedId!==id){
        WM.focusedId=id;
        const w=wmWindowById(id);
        if(w)w.z=++WM.zCounter;
        saveWM();
        document.querySelectorAll('.wm-window').forEach(x=>x.classList.toggle('focused',x.dataset.windowId===id));
        el.style.zIndex=w?w.z:10;
      }
    });
  });
  document.querySelectorAll('.wm-window .titlebar').forEach(tb=>{
    tb.addEventListener('mousedown',e=>{
      if(e.target.closest('.dot')||e.target.closest('.titlebar-back'))return;
      const winEl=tb.closest('.wm-window');
      if(!winEl)return;
      const win=wmWindowById(winEl.dataset.windowId);
      if(!win)return;
      dragState={winId:win.id,el:winEl,startX:e.clientX,startY:e.clientY,origX:win.x,origY:win.y};
      WM.focusedId=win.id;
      win.z=++WM.zCounter;
      winEl.style.zIndex=win.z;
      document.querySelectorAll('.wm-window').forEach(x=>x.classList.toggle('focused',x.dataset.windowId===win.id));
      e.preventDefault();
    });
  });
  const homePill=document.getElementById('wmHomePill');
  if(homePill)homePill.addEventListener('click',()=>{
    const home=WM.windows.find(w=>w.isHome);
    if(home){WM.focusedId=home.id;home.z=++WM.zCounter;saveWM();render()}
  });
}
document.addEventListener('mousemove',e=>{
  if(!dragState)return;
  const dx=e.clientX-dragState.startX;
  const dy=e.clientY-dragState.startY;
  const win=wmWindowById(dragState.winId);
  if(!win)return;
  win.x=Math.max(0,Math.min(window.innerWidth-200,dragState.origX+dx));
  win.y=Math.max(0,Math.min(window.innerHeight-60,dragState.origY+dy));
  dragState.el.style.left=win.x+'px';
  dragState.el.style.top=win.y+'px';
  drawLines();
});
document.addEventListener('mouseup',()=>{if(dragState){saveWM();dragState=null}});

/* ========== SECRET DOTS ========== */
function setupSecretDots(container,winId,isHome){
  const dots=container.querySelectorAll('[data-dot]');
  if(!dots.length)return;
  if(!seqState[winId])seqState[winId]={started:false,blues:new Set(),complete:false,resetTimer:null};
  const st=seqState[winId];
  const paint=()=>{dots.forEach(d=>{const idx=parseInt(d.dataset.dot,10);d.classList.toggle('blue',st.blues.has(idx))})};
  const reset=()=>{st.started=false;st.blues.clear();st.complete=false;clearTimeout(st.resetTimer);paint()};
  const scheduleReset=()=>{clearTimeout(st.resetTimer);st.resetTimer=setTimeout(reset,st.complete?3000:1700)};
  paint();
  dots.forEach(dot=>{
    dot.addEventListener('click',e=>{
      e.stopPropagation();
      const idx=parseInt(dot.dataset.dot,10);
      if(st.complete){
        reset();
        if(windowedActive()){
          const cur=wmWindowById(winId);
          if(cur){wmOpen('settings',{},cur.id);render();return}
        }
        navStack=[];
        goto('settings',{},false);
        return;
      }
      if(!st.started){
        if(isHome){
          if(idx===1){wmCloseAllExceptHome();return}
          if(idx===0||idx===2){st.started=true}
        }else{
          if(idx===2){st.started=true}
          else if(idx===0){wmClose(winId);return}
          else if(idx===1){wmCloseAllExceptHome();return}
        }
      }
      if(st.started){
        st.blues.add(idx);paint();
        if(st.blues.size===3)st.complete=true;
        scheduleReset();
      }
    });
  });
}

/* ========== EVENT WIRING ========== */
function attachHandlers(){
  const app=document.getElementById("app");
  if(windowedActive()){

    setupSecretDots(app,'single',nav.page==='home');

    el.addEventListener("click",()=>{

      goto("edit_card_form",{subject,cardIdx});
    });

  const saveEditBtn=document.getElementById("saveEditBtn");
  if(saveEditBtn)saveEditBtn.addEventListener("click",()=>{
    const{subject,cardIdx}=nav.params;

    goto("manage_card_list",{subject},false);

  app.querySelectorAll("[data-study-subject]").forEach(el=>{
    el.addEventListener("click",()=>{
      const subject=el.dataset.studySubject;
      const cards=DATA.flashcards[subject];
      if(!cards||cards.length===0){toast("No cards in this subject yet");return}
      const order=cards.map((_,i)=>i);

      if(windowedActive()){
        if(el.dataset.clearstack){wmReplace('study_session',params);return}

      goto("study_session",params);
    });

  const revealBtn=document.getElementById("revealBtn");
  if(revealBtn)revealBtn.addEventListener("click",()=>{
    if(windowedActive()){

      if(w){w.params.revealed=true;saveWM();render();return}
    }
    nav.params.revealed=true;
    render();
  });
  app.querySelectorAll("[data-study-answer]").forEach(el=>{
    el.addEventListener("click",()=>{
      let params=nav.params;
      let win=null;
      if(windowedActive()){win=wmWindowById(CURRENT_WIN_ID);if(win)params=win.params}
      const{subject,order,idx}=params;
      let correct=params.correct;
      const cardIdx=order[idx];
      const card=DATA.flashcards[subject][cardIdx];
      if(el.dataset.studyAnswer==="y"){
        correct++;
        card.review_count=(card.review_count||0)+1;
        card.last_reviewed=new Date().toISOString();
        saveData(DATA);
      }
      const nextIdx=idx+1;
      if(nextIdx>=order.length){

        DATA.study_sessions.push({subject,date:new Date().toISOString(),score:(correct/total)*100,cards_studied:total,correct_answers:correct,type:'study'});

  const deleteNoteBtn=document.getElementById("deleteNoteBtn");

    const subject=nav.params.subject;
    const noteId=nav.params.noteId;

      const file=e.target.files[0];

        const subject=nav.params.subject;

  }
  const startQuizBtn=document.getElementById("startQuizBtn");
  if(startQuizBtn)startQuizBtn.addEventListener("click",()=>{
    const subject=nav.params.subject;

    let n=parseInt(document.getElementById("numQuestions").value,10);
    if(isNaN(n))n=maxQ;
    n=Math.min(Math.max(1,n),maxQ);
    const mode=quizModeSel?quizModeSel.value:'none';
    const pool=[...DATA.flashcards[subject]];
    shuffle(pool);
    const order=pool.slice(0,n);
    const params={subject,order,idx:0,score:0,userAnswer:"",checked:false,result:null,timerMode:mode};
    if(mode==='perq'){
      let secs=parseInt((document.getElementById("quizPerQSeconds")||{}).value,10);
      if(isNaN(secs)||secs<5)secs=30;
      params.perQSeconds=secs;
      params.qEndsAt=Date.now()+secs*1000;
    }else if(mode==='whole'){
      let mins=parseInt((document.getElementById("quizWholeMinutes")||{}).value,10);
      if(isNaN(mins)||mins<1)mins=5;
      params.quizEndsAt=Date.now()+mins*60000;

          document.getElementById("importPreview").innerHTML=`<div class="card" style="border-color:#5a2424;"><div class="qa-label" style="color:var(--red);">⚠️ Not a recognized backup file</div></div>`;
          return;
        }
        const stats=mergeImportedData(parsed);
        let parts=[];
        if(stats.newSubjects)parts.push(`${stats.newSubjects} new subject${stats.newSubjects>1?'s':''}`);
        if(stats.newCards)parts.push(`${stats.newCards} new card${stats.newCards>1?'s':''}`);
        if(stats.newNotes)parts.push(`${stats.newNotes} new note${stats.newNotes>1?'s':''}`);

        toast("✅ Import complete");

  const signOutBtn=document.getElementById("signOutBtn");

  const wipeBtn=document.getElementById("wipeDataBtn");
  if(wipeBtn)wipeBtn.addEventListener("click",()=>{
    if(!confirm("Delete ALL saved data?\n\nEvery subject, flashcard, note and study session will be erased. This cannot be undone."))return;

    goto("home",{},false);

    planConfig.termDays=t;
    await savePlanConfig();
    render();
  });
  const adminRefresh=document.getElementById("adminRefreshBtn");
  if(adminRefresh)adminRefresh.addEventListener("click",()=>{adminUsersCache=null;render()});
    app.querySelectorAll("[data-admin-action]").forEach(el=>{
    el.addEventListener("click",()=>{
      const action=el.dataset.adminAction;
      const uid=el.dataset.uid;
      const plan=el.dataset.plan||null;
      adminAction(action,uid,plan);
    });
  });

/* ========== QUIZ SUBMIT / ADVANCE ========== */
function submitQuizAnswer(){
  const input=document.getElementById("quizAnswerInput");
  const userAnswer=input?input.value.trim():"";
  let params=nav.params;
  let win=null;
  if(windowedActive()){win=wmWindowById(CURRENT_WIN_ID);if(win)params=win.params}
  const{order,idx}=params;
  const card=order[idx];
  const correctAnswer=card.answer;
  const similarity=answerSimilarity(userAnswer,correctAnswer);
  let result;
  if(!userAnswer){result="wrong"}
  else if(similarity>=82){result="correct";params.score+=1}
  else if(similarity>=45){result="close"}
  else{result="wrong"}
  params.userAnswer=userAnswer;
  params.checked=true;
  params.result=result;
  if(params.timerMode&&params.timerMode!=='none'){
    params.frozenRemaining=quizRemaining(params);
  }
  if(windowedActive()&&win)saveWM();
  render();
}
function advanceQuiz(){
  let params=nav.params;
  let win=null;
  if(windowedActive()){win=wmWindowById(CURRENT_WIN_ID);if(win)params=win.params}
  const{subject,order,idx,score}=params;
  const nextIdx=idx+1;
  if(nextIdx>=order.length){
    const total=order.length;
    DATA.study_sessions.push({subject,date:new Date().toISOString(),score:(score/total)*100,cards_studied:total,correct_answers:score,type:'quiz'});
    saveData(DATA);
    const comp={subject,score,total};
    if(windowedActive()&&win){win.page='quiz_complete';win.params=comp;saveWM();render();return}
    navStack=[];
    goto("quiz_complete",comp,false);
  }else{
    const next={subject,order,idx:nextIdx,score,userAnswer:"",checked:false,result:null,timerMode:params.timerMode};
    if(params.timerMode==='perq'){next.perQSeconds=params.perQSeconds;next.qEndsAt=Date.now()+(params.perQSeconds||30)*1000}
    else if(params.timerMode==='whole'){next.quizEndsAt=params.quizEndsAt}
    if(windowedActive()&&win){win.params=next;saveWM();render();return}
    nav.params=next;
    render();
  }
}

/* ========== INIT ========== */
loadWM();
if(TIMER.active){
  const rem=timerRemaining();
  if(rem<=0&&!TIMER.paused){TIMER.alarming=true;TIMER.hidden=false;saveTimer();startChirping()}
}
setInterval(()=>{tickTimer();tickQuizTimer()},1000);
window.addEventListener('resize',()=>{render()});
window.addEventListener('online',()=>{
  if(!currentUser||!APP_READY)return;
  if(localDirty) pushDataToCloud();
  else pullDataFromCloud().then(()=>render());
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&currentUser&&APP_READY&&localDirty){
    pushDataToCloud();
  }
});
